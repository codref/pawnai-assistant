# Pawn Assistant — copy to pawn-assistant.yaml and edit.
# Precedence: CLI flags (when set) → this file → built-in defaults.
# Discovery: --config PATH, else ./pawn-assistant.yaml, else ~/.config/pawn-assistant/config.yaml

server:
  host: 127.0.0.1
  port: 8787
  log_level: INFO

audio:
  # sounddevice input index from `pawn-assistant list-devices` / `probe`.
  # null = auto (pulse → sysdefault → hw, skipping silent sources).
  device: 0
  # Input gain. On ALSA hw:N devices this is the mixer control below, in percent
  # of its range (the HUD knob drives the same control); otherwise software dB.
  # Unset = leave the mixer alone. Clipping? Try 40.
  # gain_percent: 40
  # software_gain_db: 0
  # gain_control: Capture
  sample_rate: 16000
  channels: 1
  # openWakeWord frame size (80 ms @ 16 kHz).
  frame_samples: 1280

wake:
  # Stock: hey_jarvis | hey_mycroft | alexa | hey_rhasspy
  # Or path to a trained ONNX: wakewords/hey_pawn/hey_pawn.onnx
  model: wakewords/hey_pawn/hey_pawn.onnx
  threshold: 0.5
  # HUD "stirring" band (below threshold).
  stir_threshold: 0.25
  # Mute wake scoring after beep / after a turn (ms).
  beep_mute_ms: 600
  debounce_ms: 1200
  # Keep each live wake's 2 s clip in <project>/inbox/<label>/ (confirmed,
  # false_wake, unsure, near_miss, barge) for `wake-train review/accept`.
  # auto = only when model is a wake-train project's .onnx | true | false | path
  harvest: auto
  harvest_max: 500     # newest clips kept per label
  # Run pawn-server's active wake model (published with `wake-train publish`)
  # and its suggested threshold. Needs `pawn-assistant device register`.
  auto_update: false

vad:
  # Silero speech probability threshold.
  threshold: 0.45
  # Peak dBFS to *start* an utterance if Silero is shy. Not used to prolong
  # LISTEN (room noise would never end the turn). Raise toward -25 on hot mics.
  energy_speech_db: -28.0
  # Trailing silence after you finish (ms). ~800–1000 feels calm.
  silence_end_ms: 900
  # Max listen window (ms).
  max_utterance_ms: 10000
  # Give up if no speech after wake (ms).
  speech_wait_ms: 8000
  # Consecutive speech before latching start (filters wake-word echo).
  speech_start_ms: 240
  # Minimum confirmed speech before silence can end the turn.
  min_speech_ms: 400
  # After beep, ignore energy fallback this long (ms).
  post_wake_arm_ms: 400
  # Drop this much from the head of each utterance (wake-beep leakage into the mic).
  head_trim_ms: 400

asr:
  # faster-whisper size: tiny | base | small | …
  # base is slower on CPU but far better on short Italian commands than tiny.
  model: small
  compute_type: int8
  # Preferred language: it | en | fr | … — null = autodetection (often messy).
  language: it
  # Unload Whisper from RAM after idle (seconds). 0 = keep loaded.
  idle_unload_s: 120.0
  # Biases decoding toward your commands; empty = off.
  initial_prompt: >-
    Comandi vocali: che ore sono, che giorno è oggi, imposta un timer
    di cinque minuti, quanto manca al timer, annulla il timer.
  # faster-whisper's own speech filter: trims non-speech around the command.
  vad_filter: true
  # whisper = decode after you stop | zipformer = sherpa-onnx streaming
  # (partials on the HUD while you talk, final text right at end of speech).
  engine: whisper
  streaming:
    # Folder of a sherpa-onnx *online transducer*: encoder*/decoder*/joiner*.onnx
    # + tokens.txt (int8 preferred). No official Italian model exists; community
    # Zipformer2 builds do (check the licence). uv sync --extra streaming
    model_dir: ~/.local/share/pawn-assistant/zipformer-it
    threads: 2
    # Shorter end-of-speech wait: the transcript is already done.
    silence_end_ms: 600
    # Empty streaming result → Whisper decodes the same audio.
    fallback_whisper: true
    # hotwords_file: ./hotwords.txt   # one command phrase per line (beam search)
    idle_unload_s: 300

intent:
  # Fast-path phrase match first; the local LLM only runs on a miss.
  enabled: true
  # qwen2.5-1.5b (default, ~1 GB, good Italian) | qwen2.5-0.5b (~0.4 GB, faster)
  # or a path to any instruct .gguf
  model: qwen2.5-1.5b
  # llama.cpp threads — use physical cores (4 on a typical i5).
  threads: 4
  # Unload the LLM after idle (seconds). 0 = keep loaded. The prompt KV cache
  # survives unloads, so a reload costs ~1 s instead of a full prefill.
  idle_unload_s: 300
  # difflib similarity needed to skip the LLM (0..1).
  fastpath_ratio: 0.85
  # Language of spoken/displayed replies: it | en
  reply_language: it

tts:
  # Piper local voice for replies.
  enabled: true
  # Voice id from rhasspy/piper-voices (downloaded on first use) or .onnx path.
  voice: it_IT-paola-medium
  # >1 slower, <1 faster speech.
  length_scale: 1.0
  volume: 1.0
  # Multi-speaker voices only (see `pawn-assistant voice list`); omit for default.
  # speaker_id: 0
  idle_unload_s: 300

phrase:
  # The intent LLM rewords each deterministic reply so PAWN sounds less
  # canned. Numbers/weekdays/months are checked; on any failure or timeout
  # the original reply is spoken. Needs intent.enabled.
  enabled: true
  # Persona for the rewording prompt. Empty = built-in dry HUD voice.
  persona: >-
    Sei PAWN, un assistente vocale da HUD: asciutto, preciso, con un filo di ironia.
  # Higher = more varied, but the 1.5B model gets odd above ~0.7.
  temperature: 0.6
  top_p: 0.95
  max_tokens: 60
  max_sentences: 2
  # Seconds to wait for the first spoken sentence before falling back.
  first_sentence_timeout_s: 2.5
  # all | list of intents, e.g. [greeting, unknown, timer.alert]
  # (radio.* replies are never reworded: the guard can't protect station names)
  intents: all

commands:
  # Command plugins switched off by default (HUD → MODULES toggles override
  # this and are saved in state_file). Core cannot be disabled.
  disabled: []
  # Runtime toggles + plugin state (last radio station, volume). null = off.
  # state_file: ~/.local/state/pawn-assistant/commands.json
  radio:
    # Spoken name → TuneIn guide id (the "s…" id in a tunein.com station URL).
    # Use these for stations TuneIn search ranks badly or doesn't list.
    # A spoken name is only played if a search hit's name matches it (numbers
    # included), so stations missing from TuneIn search need a preset.
    presets:
      virgin: s69185
      radio 105: s16526
      bbc radio 2: s24940   # hidden from TuneIn search
    # Played by "accendi la radio" before any station was played.
    default_station: virgin
    # Rank search hits whose language/location contain one of these first.
    prefer: [Italian, Italy]
    volume: 70        # mpv volume 0–100
    duck_volume: 12   # while PAWN listens / thinks / speaks
    duck_ramp_ms: 300
  pawn:
    # pawn-server (pawnai) base URL and its api.token (Bearer). Talks to
    # POST /v1/pawn/voice; "parliamo" starts a conversation.
    server_url: http://192.168.1.61:8000
    token: ""
    # Keypad code for "sblocca le sessioni" → full agent access (all skills
    # and tools) until the conversation ends or unlock_max_minutes pass.
    unlock_code: "1234"
    unlock_max_minutes: 15
    lockout_s: 60          # keypad disabled after 3 wrong codes
    timeout_s: 90          # per agent turn
    followup_timeout_s: 8  # silence after a reply that ends the conversation
    thinking_cue_s: 4      # soft blip if pawn is still thinking
    # Once registered (`pawn-assistant device register`), turns carry this
    # laptop's device id: "continua qui" takes over the phone's conversation
    # and "sblocca col telefono" asks the phone for a fingerprint instead of
    # the keypad. Set false to keep the voice turns anonymous.
    link_device: true
  device:
    # Link to pawn-server as a registered assistant: runs speak / notify /
    # timer_set commands the agent sends, and reports presence so the agent
    # speaks where you are. Identity comes from
    # ~/.local/state/pawn-assistant/device.json (`device register`); these
    # keys override it.
    # server_url: http://192.168.1.61:8000
    # device_id: ""
    # device_token: ""
    idle_after_s: 300   # no wake for this long → presence "idle"
    heartbeat_s: 120

aec:
  # Echo cancellation via PipeWire module-echo-cancel (WebRTC). PAWN records
  # from the echo-cancelled source and plays beeps/voice/radio into the paired
  # sink, so it can hear the wake word over itself (barge-in). Needs a mic
  # *source* in PipeWire: check with `pawn-assistant aec check`. When active,
  # audio.device is ignored (capture goes through "pulse").
  enabled: false
  method: webrtc          # webrtc | null (passthrough, for A/B)
  # source_master: alsa_input.pci-0000_00_1f.3.analog-stereo   # default: default mic
  # sink_master: alsa_output.pci-0000_00_1f.3.analog-stereo    # default: default sink
  # aec_args: "webrtc.noise_suppression=true webrtc.gain_control=false"
  keep_loaded: false

barge_in:
  # Say the wake word while PAWN talks to cut it off and give a new command.
  enabled: true
  # Wake score needed while PAWN speaks; null = wake.threshold + 0.1.
  threshold: null
  frames: 2           # consecutive 80 ms frames over the threshold
  arm_ms: 300         # ignore the first part of each reply
  # Off without AEC: PAWN's own voice would reach the wake model.
  require_aec: true

beep:
  freq_hz: 880.0
  duration_ms: 120
  volume: 0.25

hud:
  meter_hz: 20.0

debug:
  # Directory for wake_*/utt_*/near_miss_* WAVs. null = disabled.
  audio_dir: ./debug-audio
  preroll_s: 8.0
  # Dump preroll when wake score crosses this (near-miss tuning).
  wake_score_dump: 0.25
