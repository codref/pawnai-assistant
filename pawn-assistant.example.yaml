# Pawn Assistant — copy to pawn-assistant.yaml and edit.
# Precedence: CLI flags (when set) → this file → built-in defaults.
# Discovery: --config PATH, else ./pawn-assistant.yaml, else ~/.config/pawn-assistant/config.yaml

server:
  host: 127.0.0.1
  port: 8787
  log_level: INFO

audio:
  # sounddevice input index from `pawn-assistant list-devices` / `probe`.
  # null = auto (pulse → sysdefault → hw, skipping silent sources).
  device: 0
  sample_rate: 16000
  channels: 1
  # openWakeWord frame size (80 ms @ 16 kHz).
  frame_samples: 1280

wake:
  # Stock: hey_jarvis | hey_mycroft | alexa | hey_rhasspy
  # Or path to a trained ONNX: wakewords/hey_pawn/hey_pawn.onnx
  model: wakewords/hey_pawn/hey_pawn.onnx
  threshold: 0.5
  # HUD "stirring" band (below threshold).
  stir_threshold: 0.25
  # Mute wake scoring after beep / after a turn (ms).
  beep_mute_ms: 600
  debounce_ms: 1200

vad:
  # Silero speech probability threshold.
  threshold: 0.45
  # Peak dBFS to *start* an utterance if Silero is shy. Not used to prolong
  # LISTEN (room noise would never end the turn). Raise toward -25 on hot mics.
  energy_speech_db: -28.0
  # Trailing silence after you finish (ms). ~800–1000 feels calm.
  silence_end_ms: 900
  # Max listen window (ms).
  max_utterance_ms: 10000
  # Give up if no speech after wake (ms).
  speech_wait_ms: 8000
  # Consecutive speech before latching start (filters wake-word echo).
  speech_start_ms: 240
  # Minimum confirmed speech before silence can end the turn.
  min_speech_ms: 400
  # After beep, ignore energy fallback this long (ms).
  post_wake_arm_ms: 400

asr:
  # faster-whisper size: tiny | base | small | …
  # base is slower on CPU but far better on short Italian commands than tiny.
  model: base
  compute_type: int8
  # Preferred language: it | en | fr | … — null = autodetection (often messy).
  language: it
  # Unload Whisper from RAM after idle (seconds). 0 = keep loaded.
  idle_unload_s: 120.0

beep:
  freq_hz: 880.0
  duration_ms: 120
  volume: 0.25

hud:
  meter_hz: 20.0

debug:
  # Directory for wake_*/utt_*/near_miss_* WAVs. null = disabled.
  audio_dir: ./debug-audio
  preroll_s: 8.0
  # Dump preroll when wake score crosses this (near-miss tuning).
  wake_score_dump: 0.25
